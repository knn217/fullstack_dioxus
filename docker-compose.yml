services:
  dx_web_server:
    image: dx_web_server_img
    # environment:
    #   DATABASE_URL: "postgresql://user_be@${COCKROACH_CLUSTER_IP}/chat_db?${JDBC_OPTIONS}"
    #   CHAT_BE_PORT: 8080
    build:
      context: .
      dockerfile: ./Dockerfile.server
    ports:
      - "8080:8080"

  # Dedicated service to extract SBOMs to the host without keeping them in the runtime image
  sbom_export:
    image: scratch
    build:
      context: .
      dockerfile: ./Dockerfile.server
      target: sbom-export
