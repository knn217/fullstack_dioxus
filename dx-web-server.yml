apiVersion: apps/v1
kind: Deployment
metadata:
  name: dx-web-server
  labels:
    app: dx-web-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dx-web-server
  template:
    metadata:
      labels:
        app: dx-web-server
    spec:
      containers:
        - name: dx-web-server
          image: dx_web_server_img:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: IP
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "postgresql://root@host.k3d.internal:26257/defaultdb?sslmode=verify-ca&sslrootcert=/certs/ca.crt&sslcert=/certs/client.root.crt&sslkey=/certs/client.root.key"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 20
          volumeMounts:
            - name: db-certs
              mountPath: /certs
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
      volumes:
        - name: db-certs
          secret:
            secretName: dx-db-certs
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: dx-web-server
spec:
  type: ClusterIP
  selector:
    app: dx-web-server
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080