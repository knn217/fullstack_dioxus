name: 'Setup Web'
description: 'Creates web cluster, imports image, deploys behind a k3d load balancer, and tests ping'
runs:
  using: "composite"
  steps:
    - name: Create dedicated k3d cluster for Dioxus web server
      shell: bash
      run: k3d cluster create dx-web-cluster --agents 1 -p "8080:8080@loadbalancer" --wait

    - name: Import web server image into dx-web-cluster
      shell: bash
      run: k3d image import ./dx-web-server.tar --cluster dx-web-cluster

    - name: Deploy and run Dioxus web server in its own cluster
      shell: bash
      run: |
        K="kubectl --context k3d-dx-web-cluster"
        HOST_IP=$(docker network inspect k3d-dx-web-cluster -f '{{(index .IPAM.Config 0).Gateway}}')
        if [ -z "$HOST_IP" ]; then
          echo "::error::Could not determine Docker gateway IP"
          exit 1
        fi

        $K create secret generic dx-db-certs \
          --from-file=certs/ca.crt \
          --from-file=certs/client.root.crt \
          --from-file=certs/client.root.key

        sed "s/__HOST_IP__/${HOST_IP}/g" ./dx-web-server.yml | $K apply -f -

        if ! $K rollout status deploy/dx-web-server --timeout=120s; then
          $K get pods -o wide
          $K logs -l app=dx-web-server --tail=100 || true
          exit 1
        fi

    - name: Ping web server through the load balancer
      shell: bash
      run: |
        for _ in $(seq 60); do
          output=$(curl -s -w "---HTTP_CODE_SPLIT---%{http_code}" http://127.0.0.1:8080/ping || true)
          response="${output%%---HTTP_CODE_SPLIT---*}"
          http_code="${output##*---HTTP_CODE_SPLIT---}"

          if [ "$http_code" = "200" ] && [ "$response" = "pong" ]; then
            echo "Successfully received HTTP 200 and 'pong'"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Failed to get HTTP 200 and 'pong'"
        kubectl --context k3d-dx-web-cluster get svc,pods -o wide || true
        kubectl --context k3d-dx-web-cluster logs -l app=dx-web-server --tail=50 || true
        exit 1