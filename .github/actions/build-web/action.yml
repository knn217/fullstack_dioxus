name: 'Build Web'
description: 'Sets up buildx, builds Dioxus web server, exports tarball, and extracts SBOMs'
runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 1: build only the dependency stage. On an unchanged recipe.json this is all
    # cache hits and uploads nothing. The cache is written only on main, so PR builds
    # can read it but can't evict it.
    - name: Warm dependency cache
      uses: docker/bake-action@v6
      env:
        BUILDKIT_PROGRESS: plain
      with:
        files: docker-compose.yml
        targets: dx_web_server
        push: false
        set: |
          dx_web_server.target=deps
          dx_web_server.cache-from=type=gha,scope=dx_web
          ${{ github.ref == 'refs/heads/main' && 'dx_web_server.cache-to=type=gha,scope=dx_web,mode=max,compression=zstd,ignore-error=true' || '' }}
          dx_web_server.output=type=cacheonly

    # Step 2: build the full image tarball and extract SBOMs concurrently
    - name: Build Dioxus web server & Export SBOMs
      uses: docker/bake-action@v6
      env:
        BUILDKIT_PROGRESS: plain
      with:
        files: docker-compose.yml
        targets: dx_web_server,sbom_export
        push: false
        set: |
          dx_web_server.cache-from=type=gha,scope=dx_web
          dx_web_server.output=type=docker,dest=./dx-web-server.tar
          sbom_export.cache-from=type=gha,scope=dx_web
          sbom_export.output=type=local,dest=./artifacts/sbom

    - name: Verify dx web tar file exists
      shell: bash
      run: |
        if [ ! -f "./dx-web-server.tar" ]; then
          echo "::error::Backend image tarball not found"
          exit 1
        fi
        file "./dx-web-server.tar"
        ls -lh ./dx-web-server.tar

    - name: Verify SBOM files exist
      shell: bash
      run: |
        if [ ! -d "./artifacts/sbom" ] || [ -z "$(ls -A ./artifacts/sbom)" ]; then
          echo "::error::SBOM artifacts not found"
          exit 1
        fi
        echo "=== Generated SBOM Files ==="
        ls -lh ./artifacts/sbom

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@a0e5e8d8f5936915ac0292775f38a64d6fabe7a7
      with:
        cache: true

    - name: Scan SBOMs for licenses
      shell: bash
      run: |
        set -euo pipefail
        for sbom in ./artifacts/sbom/*.json; do
          echo "=== License scan: $sbom ==="
          trivy sbom \
            --scanners=license \
            --config=trivy.yml \
            --ignorefile=.trivyignore \
            --exit-code=1 \
            "$sbom" || exit $?
        done

    - name: Scan SBOMs for vulnerabilities
      shell: bash
      run: |
        set -euo pipefail
        for sbom in ./artifacts/sbom/*.json; do
          echo "=== Vulnerability scan: $sbom ==="
          trivy sbom \
            --scanners=vuln \
            --config=trivy.yml \
            --ignorefile=.trivyignore \
            --exit-code=1 \
            "$sbom" || exit $?
        done