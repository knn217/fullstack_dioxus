name: test-distributed-system
on: [push, workflow_dispatch]

jobs:
  test-distributed-system:
    runs-on: ubuntu-latest
    env:
      DX_WEB_IMAGE_TAR: ./dx-web-server.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster and deploy CockroachDB
        run: bash scripts/k3d-cockroach.sh

      - name: Validate the database
        run: bash scripts/test-cockroach.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dioxus web server with cache
        uses: docker/bake-action@v2.3.0
        with:
          files: docker-compose.yml
          targets: dx_web_server
          push: false
          set: |
            dx_web_server.cache-from=type=gha
            dx_web_server.cache-to=type=gha,mode=max
            dx_web_server.output=type=docker

      - name: Export Dioxus web image to tarball
        run: |
          docker save -o "${{ env.DX_WEB_IMAGE_TAR }}" "dx_web_server_img"

      - name: Verify dx web tar file exists
        run: |
          echo "Checking directory contents:"
          ls -lh "$(dirname "${{ env.DX_WEB_IMAGE_TAR }}")" || true
          if [ ! -f "${{ env.DX_WEB_IMAGE_TAR }}" ]; then
            echo "::error::Backend image tarball not found at ${{ env.DX_WEB_IMAGE_TAR }}"
            exit 1
          fi
          file "${{ env.DX_WEB_IMAGE_TAR }}"
