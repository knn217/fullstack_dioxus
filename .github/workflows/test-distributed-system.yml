name: test-distributed-system
on: [push, workflow_dispatch]

jobs:
  test-distributed-system:
    runs-on: ubuntu-latest
    env:
      DX_WEB_IMAGE_TAR: ./dx-web-server.tar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Create k3d cluster and deploy CockroachDB
        run: |
          # Capture stdout and grab the line containing DATABASE_URL=
          db_env_output=$(bash scripts/k3d-cockroach.sh | grep "DATABASE_URL=" | head -n 1 || true)

          # Check if it's empty
          if [ -z "$db_env_output" ]; then
            echo "::error::Failed to find DATABASE_URL in script output."
            exit 1
          fi

          # Strip 'export ' if present, remove surrounding quotes, and write cleanly to $GITHUB_ENV
          cleaned_url=$(printf '%s\n' "$db_env_output" \
            | sed -E 's/^.*DATABASE_URL=//; s/[[:space:]]+$//' \
            | tr -d "\"'")

          echo "DATABASE_URL=$cleaned_url" >> $GITHUB_ENV

          echo "The database URL is successfully configured!"

      - name: Port-forward the database
        run: |
          kubectl port-forward --address 0.0.0.0 svc/crdb-cockroachdb-public 26257:26257 >/tmp/pf-db.log 2>&1 &
          for _ in $(seq 30); do (exec 3<>/dev/tcp/127.0.0.1/26257) 2>/dev/null && break; sleep 1; done

      - name: Validate the database
        run: |
          echo "DATABASE_URL is: $DATABASE_URL"
          bash scripts/test-cockroach.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dioxus web server with cache
        uses: docker/bake-action@v2.3.0
        with:
          files: docker-compose.yml
          targets: dx_web_server
          push: false
          set: |
            dx_web_server.cache-from=type=gha
            dx_web_server.cache-to=type=gha,mode=max
            dx_web_server.output=type=docker

      - name: Export Dioxus web image to tarball
        run: |
          docker save -o "${{ env.DX_WEB_IMAGE_TAR }}" "dx_web_server_img"

      - name: Verify dx web tar file exists
        run: |
          echo "Checking directory contents:"
          ls -lh "$(dirname "${{ env.DX_WEB_IMAGE_TAR }}")" || true
          if [ ! -f "${{ env.DX_WEB_IMAGE_TAR }}" ]; then
            echo "::error::Backend image tarball not found at ${{ env.DX_WEB_IMAGE_TAR }}"
            exit 1
          fi
          file "${{ env.DX_WEB_IMAGE_TAR }}"

      - name: Create dedicated k3d cluster for Dioxus web server
        run: |
          k3d cluster create dx-web-cluster --agents 1

      - name: Import web server image into dx-web-cluster
        run: |
          k3d image import "${{ env.DX_WEB_IMAGE_TAR }}" --cluster dx-web-cluster

      - name: Deploy and run Dioxus web server in its own cluster
        run: |
          K="kubectl --context k3d-dx-web-cluster"

          # Host as seen from inside the web cluster's Docker network (no DNS needed)
          HOST_IP=$(docker network inspect k3d-dx-web-cluster -f '{{(index .IPAM.Config 0).Gateway}}')
          if [ -z "$HOST_IP" ]; then
            echo "::error::Could not determine the Docker gateway IP for k3d-dx-web-cluster"
            exit 1
          fi
          echo "Web cluster reaches the host at $HOST_IP"

          $K create secret generic dx-db-certs \
            --from-file=certs/ca.crt \
            --from-file=certs/client.root.crt \
            --from-file=certs/client.root.key

          sed "s/__HOST_IP__/${HOST_IP}/g" ./dx-web-server.yml | $K apply -f -

          if ! $K rollout status deploy/dx-web-server --timeout=30s; then
            $K get pods -o wide
            $K describe pods -l app=dx-web-server
            $K logs -l app=dx-web-server --tail=100 || true
            $K logs -l app=dx-web-server --previous --tail=100 || true
            exit 1
          fi

      - name: Port-forward the web server
        run: |
          kubectl --context k3d-dx-web-cluster port-forward svc/dx-web-server 8080:8080 >/dev/null 2>&1 &
          for _ in $(seq 30); do (exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null && break; sleep 1; done

      - name: Ping web server
        run: |
          echo "Testing /ping endpoint..."
          for _ in $(seq 15); do
            output=$(curl -s -w "---HTTP_CODE_SPLIT---%{http_code}" http://127.0.0.1:8080/ping || true)
            response="${output%%---HTTP_CODE_SPLIT---*}"
            http_code="${output##*---HTTP_CODE_SPLIT---}"

            if [ "$http_code" = "200" ]; then
              if [ "$response" = "pong" ]; then
                echo "Successfully received HTTP 200 and 'pong'"
                exit 0
              else
                echo "Got HTTP 200, but response body was: '$response' (waiting for 'pong')"
              fi
            else
              echo "Got HTTP status: $http_code (waiting for 200)"
            fi
            sleep 1
          done
          echo "::error::Failed to get HTTP 200 and 'pong'. Last status: $http_code, response: '$response'"
          exit 1

      - name: Debug web server
        if: failure()
        run: |
          kubectl --context k3d-dx-web-cluster get pods -o wide
          kubectl --context k3d-dx-web-cluster logs deploy/dx-web-server --tail=100 || true
          kubectl --context k3d-dx-web-cluster logs deploy/dx-web-server --previous --tail=100 || true