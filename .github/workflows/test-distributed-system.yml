name: test-distributed-system
on: [push, workflow_dispatch]

jobs:
  # Runs database setup & build web in parallel
  call-setup-db:
    uses: ./.github/workflows/setup-db.yml

  call-build-web:
    uses: ./.github/workflows/build-web.yml

  # Runs after both parallel jobs complete successfully
  call-setup-web:
    needs: [call-setup-db, call-build-web]
    uses: ./.github/workflows/setup-web.yml